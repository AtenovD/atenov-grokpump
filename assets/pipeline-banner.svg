<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #fef2f2;
      --card-border: #fecaca;
      --text: #450a0a;
      --text-muted: #b91c1c;
      --chip-bg: #fee2e2;
      --chip-border: #fca5a5;
      --arrow: #ef4444;
      --ok-bg: #f0fdf4;
      --ok-border: #86efac;
      --ok-text: #15803d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #170707;
        --card-bg: #2a0f0f;
        --card-border: #7f1d1d;
        --text: #fee2e2;
        --text-muted: #fca5a5;
        --chip-bg: #3a1414;
        --chip-border: #b91c1c;
        --arrow: #f87171;
        --ok-bg: #0f2e1a;
        --ok-border: #22c55e;
        --ok-text: #86efac;
      }
    }
    text { fill: var(--text); }
    .muted { fill: var(--text-muted); }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; }
    .stage-label { font-size: 14px; font-weight: 700; }
    .stage-sub { font-size: 11px; }
    .card { fill: var(--card-bg); stroke: var(--card-border); stroke-width: 1.5; }
    .chip { fill: var(--chip-bg); stroke: var(--chip-border); stroke-width: 1.2; }
    .arrow { stroke: var(--arrow); stroke-width: 2.5; fill: none; }
    .arrowhead { fill: var(--arrow); }
    .ok { fill: var(--ok-bg); stroke: var(--ok-border); stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="1200" height="600" fill="var(--bg)"/>
  <text x="40" y="42" class="title">PumpGuard Bot — screening pipeline</text>
  <text x="40" y="64" class="subtitle muted">Every new pump.fun launch runs this gauntlet before a single (simulated) SOL moves</text>

  <!-- Stage 1: monitor -->
  <rect x="40" y="100" width="170" height="140" rx="14" class="card"/>
  <text x="58" y="130" class="stage-label">📡 Launch monitor</text>
  <text x="58" y="156" class="stage-sub muted">PumpPortal WS feed</text>
  <text x="58" y="174" class="stage-sub muted">age + buyer count</text>
  <text x="58" y="192" class="stage-sub muted">filter, no LLM yet</text>

  <path d="M 218 170 L 250 170" class="arrow"/>
  <polygon points="250,170 240,164 240,176" class="arrowhead"/>

  <!-- Stage 2: reputation -->
  <rect x="260" y="100" width="170" height="140" rx="14" class="card"/>
  <text x="278" y="130" class="stage-label">📖 Reputation</text>
  <text x="278" y="156" class="stage-sub muted">creator blocked</text>
  <text x="278" y="174" class="stage-sub muted">after prior rugs?</text>
  <text x="278" y="192" class="stage-sub muted">free, no LLM</text>

  <path d="M 438 170 L 470 170" class="arrow"/>
  <polygon points="470,170 460,164 460,176" class="arrowhead"/>

  <!-- Stage 3: 3 agents -->
  <rect x="480" y="80" width="330" height="200" rx="14" class="card"/>
  <text x="500" y="110" class="stage-label">🤖 Three Grok agents (grok-4-fast)</text>
  <rect x="500" y="126" width="290" height="40" rx="9" class="chip"/>
  <text x="514" y="151" class="stage-sub">🔎 Auditor — wash trading / bundled buys</text>
  <rect x="500" y="174" width="290" height="40" rx="9" class="chip"/>
  <text x="514" y="199" class="stage-sub">📢 Narrative — meme attention potential</text>
  <rect x="500" y="222" width="290" height="40" rx="9" class="chip"/>
  <text x="514" y="247" class="stage-sub">⏱ Timing — self-observed market window</text>

  <path d="M 818 180 L 850 180" class="arrow"/>
  <polygon points="850,180 840,174 840,186" class="arrowhead"/>

  <!-- Stage 4: checker -->
  <rect x="860" y="100" width="150" height="140" rx="14" class="card"/>
  <text x="878" y="130" class="stage-label">⚖️ Checker</text>
  <text x="878" y="156" class="stage-sub muted">grok-4, adversarial</text>
  <text x="878" y="174" class="stage-sub muted">argues to REJECT</text>
  <text x="878" y="192" class="stage-sub muted">even if 3 passed</text>

  <path d="M 1018 170 L 1050 170" class="arrow"/>
  <polygon points="1050,170 1040,164 1040,176" class="arrowhead"/>

  <!-- Stage 5: risk -->
  <rect x="1060" y="100" width="100" height="140" rx="14" class="card"/>
  <text x="1075" y="130" class="stage-label" font-size="13">🛡 Risk</text>
  <text x="1075" y="156" class="stage-sub muted">5 limits</text>
  <text x="1075" y="174" class="stage-sub muted">size calc</text>

  <!-- down arrow to executor -->
  <path d="M 1110 240 L 1110 270 L 610 270 L 610 300" class="arrow"/>
  <polygon points="610,300 604,290 616,290" class="arrowhead"/>

  <!-- Stage 6: executor -->
  <rect x="440" y="310" width="340" height="110" rx="14" class="ok"/>
  <text x="460" y="342" class="stage-label" fill="var(--ok-text)">✅ Dry-run executor</text>
  <text x="460" y="366" class="stage-sub" fill="var(--ok-text)">Simulated buy — no wallet, no signing,</text>
  <text x="460" y="384" class="stage-sub" fill="var(--ok-text)">no on-chain transaction, ever.</text>

  <!-- bottom notes -->
  <rect x="40" y="450" width="1120" height="130" rx="16" class="card"/>
  <text x="60" y="482" class="stage-label">Cheap filters first, expensive model last</text>
  <text x="60" y="508" class="stage-sub muted">Code-only filters (monitor + reputation) run before any Grok call. The three fast agents run in</text>
  <text x="60" y="526" class="stage-sub muted">parallel on grok-4-fast; only tokens that clear all three reach the stronger, pricier grok-4 checker.</text>
  <text x="60" y="544" class="stage-sub muted">The risk manager is pure arithmetic and always has the final word — a great score can still be blocked.</text>
</svg>
